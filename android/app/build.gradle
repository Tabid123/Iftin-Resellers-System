apply plugin: 'com.android.application'

def appVersionCodeValue = System.getenv("APP_VERSION_CODE")?.trim()
def appVersionNameValue = System.getenv("APP_VERSION_NAME")?.trim()

android {
    namespace = "com.iftin.agents"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.iftin.agents"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode (appVersionCodeValue?.isInteger() ? appVersionCodeValue.toInteger() : 1)
        versionName (appVersionNameValue ?: "1.0.0")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            def storeFilePath = System.getenv("ANDROID_KEYSTORE_PATH")
            if (storeFilePath) {
                storeFile file(storeFilePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv("ANDROID_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

/*
 * OneSignal Android branding for every tenant build.
 *
 * - ic_stat_onesignal_default: status-bar/small icon. Android renders small
 *   notification icons as a monochrome mask.
 * - tenant_notification_logo: full-colour large icon shown in the expanded
 *   notification. This is copied from the tenant launcher artwork generated by
 *   the build workflow, so it never depends on OneSignal fetching a remote URL.
 */
tasks.register("prepareTenantNotificationIcons") {
    doLast {
        def densities = ["mdpi", "hdpi", "xhdpi", "xxhdpi", "xxxhdpi"]

        densities.each { density ->
            def candidates = [
                file("src/main/res/mipmap-${density}/ic_launcher_foreground.png"),
                file("src/main/res/mipmap-${density}/ic_launcher.png")
            ]
            def sourceIcon = candidates.find { it.exists() }
            if (sourceIcon != null) {
                def targetDir = file("src/main/res/drawable-${density}")
                targetDir.mkdirs()
                copy {
                    from sourceIcon
                    into targetDir
                    rename { "ic_stat_onesignal_default.png" }
                }
            }
        }

        // Prefer the highest density launcher artwork for the full-colour large
        // icon. drawable-nodpi prevents Android from re-scaling it as a density
        // asset before OneSignal hands it to NotificationCompat.
        def largeIconCandidates = [
            file("src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png"),
            file("src/main/res/mipmap-xxxhdpi/ic_launcher.png"),
            file("src/main/res/mipmap-xxhdpi/ic_launcher_foreground.png"),
            file("src/main/res/mipmap-xxhdpi/ic_launcher.png")
        ]
        def largeIconSource = largeIconCandidates.find { it.exists() }
        if (largeIconSource != null) {
            def targetDir = file("src/main/res/drawable-nodpi")
            targetDir.mkdirs()
            copy {
                from largeIconSource
                into targetDir
                rename { "tenant_notification_logo.png" }
            }
        }
    }
}

preBuild.dependsOn("prepareTenantNotificationIcons")

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
