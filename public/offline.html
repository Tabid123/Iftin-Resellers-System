<!DOCTYPE html>
<html lang="so">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f4f6fb; color: #0f172a; text-align: center; padding: 24px;
    }
    .card { max-width: 340px; }
    img { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; margin-bottom: 20px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { font-size: 15px; line-height: 1.5; color: #475569; margin: 0 0 20px; }
    button {
      background: #1e3a8a; color: #fff; border: 0; border-radius: 10px;
      padding: 12px 24px; font-size: 15px; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icon-192.png" alt="">
    <h1>Internet ma jiro</h1>
    <p>App-ku wuu furan yahay, laakiin xogta cusub lama soo dejin karo. Fadlan hubi internetkaaga kadibna isku day mar kale.</p>
    <button onclick="location.replace('/')">Isku day mar kale</button>
  </div>
</body>
</html>
