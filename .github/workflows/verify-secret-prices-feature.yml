name: Verify tenant secret prices feature

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/apply-secret-prices-feature.py'
      - 'scripts/fix-secret-prices-postpatch.py'
      - 'src/**'
      - 'supabase/**'
      - '.github/workflows/verify-secret-prices-feature.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply secret price patches
        run: |
          python3 scripts/apply-secret-prices-feature.py
          python3 scripts/fix-secret-prices-postpatch.py

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: bun run build

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check payment receipt function
        run: deno check supabase/functions/process-payment-receipt/index.ts

      - name: Validate and persist verified source patches
        run: |
          git diff --check -- \
            src/components/admin/simple/ConfigViews.tsx \
            src/integrations/supabase/types.ts \
            supabase/functions/process-payment-receipt/index.ts

          if git diff --quiet -- \
            src/components/admin/simple/ConfigViews.tsx \
            src/integrations/supabase/types.ts \
            supabase/functions/process-payment-receipt/index.ts; then
            echo "Secret price source patches already persisted"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/admin/simple/ConfigViews.tsx \
            src/integrations/supabase/types.ts \
            supabase/functions/process-payment-receipt/index.ts
          git commit -m "Polish tenant secret price matching"
          git push origin HEAD:${{ github.head_ref }}
