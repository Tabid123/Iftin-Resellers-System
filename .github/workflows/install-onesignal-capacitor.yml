name: Install OneSignal Capacitor dependency

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-onesignal-capacitor.yml"

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Add official OneSignal Capacitor SDK
        run: bun add @onesignal/capacitor-plugin@1.0.6

      - name: Commit dependency and lockfile
        run: |
          if git diff --quiet -- package.json bun.lock; then
            echo "Dependency already installed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          git commit -m "Add OneSignal Capacitor SDK"
          git push origin HEAD:main
