name: Verify web build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # GitHub release downloads for setup-bun are intermittently returning
      # HTTP 504. npm publishes the same pinned Bun binary.
      - name: Install Bun from npm
        run: |
          npm install --global bun@1.4.4
          bun --version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Guard splash and route transitions
        run: |
          set -e
          if grep -Fq 'earlyNativeLiveHandoffScript' src/routes/__root.tsx; then
            echo "::error::Native packaged startup must not redirect to the live website."
            exit 1
          fi
          if grep -Fq 'function NativeLiveStartupGate' src/routes/__root.tsx; then
            echo "::error::Background NativeLiveStartupGate must not return; it causes duplicate splash/reload after interaction."
            exit 1
          fi
          grep -Fq 'iftin-native-prehydrate-splash' src/routes/__root.tsx
          grep -Fq 'NATIVE_SPLASH_SEEN_PREFIX' src/components/TenantGate.tsx
          grep -Fq 'defaultPendingMs: 60_000' src/router.tsx
          grep -Fq 'WEB_SPLASH_MS = 1500' src/components/TenantGate.tsx

      - name: Verify Somtel carrier receipt and safe manual resends
        run: bun run test -- tests/somtelCarrierReceipt.test.ts tests/resendOrder.test.ts

      - name: Test Somlink wallet identifiers
        run: bun run test -- tests/somlinkWallet.test.ts tests/phonePrefixes.test.ts

      - name: Test customer login phone prefixes 63, 90 and 65
        run: bun run test -- tests/loginPhonePrefixes.test.ts

      - name: Verify clickable Iftin Digital Solutions attribution
        run: bun run test -- tests/poweredByIftin.test.ts

      - name: Verify clean tenant Profiles without Iftin promotional card
        run: bun run test -- tests/profileIftinPromotion.test.ts
      - name: Test tenant admin skeleton and access gating
        run: bun run test -- tests/adminLoadingStates.test.ts

      - name: Verify Manual Order category/package filtering
        run: bun run test -- tests/manualDeliveryCategoryPackages.test.ts

      - name: Verify System Codes category/package filtering
        run: bun run test -- tests/systemCodeCategoryPackages.test.ts

      - name: Verify tenant admin PWA install routing
        run: bun run test -- tests/adminPwaInstall.test.ts

      - name: Verify smart Admin PWA banner
        run: bun run test -- tests/adminSmartInstallBanner.test.ts

      - name: Verify owner-only password reset routing
        run: bun run test -- tests/platformOwnerPasswordReset.test.ts

      - name: Verify compatibility of OTA with existing Android tenant APKs
        run: node --test tests/nativeOta.test.mjs

      - name: Verify Iftin platform branding and tenant logo isolation
        run: node --test tests/brandingIsolation.test.mjs

      - name: Check Iftin logo and favicon assets
        run: node --test tests/platformLogoStatic.test.mjs

      - name: Verify Super Admin tab navigation without document refresh
        run: node --test tests/platformNoRefresh.test.mjs

      - name: Verify tenant Settings WhatsApp and Call FAB controls
        run: bun run test -- tests/tenantFabSettings.test.ts tests/shopPaymentSupport.test.ts

      - name: Verify tenant shop payment methods and safe USSD links
        run: bun run test -- tests/shopPaymentOptions.test.ts tests/shopEvcDial.test.ts

      - name: Verify storefront images, brand logos, WhatsApp and fast loading
        run: bun run test -- tests/shopStorefrontExperience.test.ts

      - name: Verify Orders date picker and day-scoped totals
        run: bun run test -- tests/ordersDateFilter.test.ts

      - name: Verify professional Somlink API order receipts
        run: bun run test -- tests/somlinkReceiptCard.test.ts

      - name: Verify APK Call and WhatsApp FAB sync with tenant Settings
        run: bun run test -- tests/apkFabSupportSync.test.ts tests/tenantFabSettings.test.ts

      - name: Verify Somlink virtual device and secure manual dispatch
        run: bun run test -- tests/somlinkManualDevice.test.ts

      - name: Build
        run: bun run build
