name: Verify web build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # GitHub release downloads for setup-bun are intermittently returning
      # HTTP 504. npm publishes the same pinned Bun binary.
      - name: Install Bun from npm
        run: |
          npm install --global bun@1.4.4
          bun --version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test staff permission rules
        run: bunx vitest run tests/staffAccessRules.test.ts
      - name: Guard splash and route transitions
        run: |
          set -e
          if grep -Fq 'earlyNativeLiveHandoffScript' src/routes/__root.tsx; then
            echo "::error::Native packaged startup must not redirect to the live website."
            exit 1
          fi
          if grep -Fq 'function NativeLiveStartupGate' src/routes/__root.tsx; then
            echo "::error::Background NativeLiveStartupGate must not return; it causes duplicate splash/reload after interaction."
            exit 1
          fi
          grep -Fq 'iftin-native-prehydrate-splash' src/routes/__root.tsx
          grep -Fq 'NATIVE_SPLASH_SEEN_PREFIX' src/components/TenantGate.tsx
          grep -Fq 'defaultPendingMs: 60_000' src/router.tsx
          grep -Fq 'WEB_SPLASH_MS = 1500' src/components/TenantGate.tsx

      - name: Build
        run: bun run build
