name: Verify web build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Diagnose production audio assets
        run: |
          set -euo pipefail
          check_audio() {
            name="$1"
            url="$2"
            expected="$3"
            tmp="$(mktemp)"
            code="$(curl -L -sS -o "$tmp" -w '%{http_code}' "$url")"
            size="$(wc -c < "$tmp" | tr -d ' ')"
            type="$(file -b --mime-type "$tmp" || true)"
            echo "$name status=$code size=$size type=$type url=$url"
            test "$code" = "200"
            test "$size" = "$expected"
          }
          check_audio phone "https://iftinagents.com/__l5e/assets-v1/035ae08a-83c5-483c-a7a7-fc834544cf83/phone-number-prompt.wav" 214158
          check_audio otp "https://iftinagents.com/__l5e/assets-v1/bd53b427-602d-4cdb-9102-ac6c3d065c12/otp-code-prompt.wav" 297678
          check_audio offline "https://iftinagents.com/__l5e/assets-v1/d208b555-c658-4bb2-9ad9-fb3aeac0e72f/offline-mode-prompt.wav" 375438
      - name: Build
        run: bun run build
