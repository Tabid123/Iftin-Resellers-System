name: Build USSD delivery agent

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android-app/**'
      - '.github/workflows/build-delivery-agent.yml'
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-delivery-agent.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Overrides the defaults baked into android-app/app/build.gradle.kts
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      DELIVERY_API_BASE_URL: ${{ secrets.SUPABASE_URL && format('{0}/functions/v1/activate-package', secrets.SUPABASE_URL) || '' }}
      DELIVERY_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build and test Iftin delivery agent
        working-directory: android-app
        run: gradle testDebugUnitTest assembleDebug --no-daemon
      # The shared USSD agent is separate from each tenant's branded customer APK.
      # Publish only after unit tests and build pass, never from pull requests.
      - name: Publish shared USSD agent APK to Supabase
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SERVICE_KEY:-}" ]; then
            echo "::error::Supabase storage publish secrets are missing"
            exit 1
          fi
          APK="android-app/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          curl --retry 3 --retry-delay 2 -fsS -X POST \
            "$SUPABASE_URL/storage/v1/object/apks/agents/iftin-resellers-ussd-agent.apk" \
            -H "Authorization: Bearer $SERVICE_KEY" \
            -H "apikey: $SERVICE_KEY" \
            -H "x-upsert: true" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary "@$APK"
          echo "Shared USSD agent published; tenant-branded APK URLs remain unchanged."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iftin-delivery-agent
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
