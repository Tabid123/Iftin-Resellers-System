name: Build tenant iOS app
run-name: iOS ${{ inputs.tenant_slug || 'marwaan' }} (${{ inputs.build_mode || 'simulator' }})

on:
  workflow_dispatch:
    inputs:
      tenant_slug:
        description: Tenant slug
        required: true
        default: marwaan
      app_name:
        description: App name (blank uses the tenant name)
      app_id:
        description: Apple bundle identifier (blank uses com.iftin.<slug>)
      version_name:
        description: App version
        default: '1.0.0'
      version_code:
        description: Build number (increase for each App Store upload)
        default: '1'
      build_mode:
        description: Simulator test or signed App Store package
        type: choice
        options: [simulator, app-store]
        default: simulator
      upload_to_testflight:
        description: Upload the signed package to App Store Connect
        type: boolean
        default: false
  push:
    branches: [codex/marwaan-ios]
    paths:
      - .github/workflows/build-tenant-ios.yml
      - scripts/configure-tenant-ios.py
      - scripts/generate-tenant-offline-bootstrap.mjs
      - package.json
      - bun.lock

permissions:
  contents: read

concurrency:
  group: tenant-ios-${{ inputs.tenant_slug || 'marwaan' }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    environment: ios-${{ inputs.tenant_slug || 'marwaan' }}
    env:
      TENANT_SLUG: ${{ inputs.tenant_slug || 'marwaan' }}
      APP_NAME: ${{ inputs.app_name }}
      APP_ID: ${{ inputs.app_id }}
      APP_VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}
      APP_VERSION_CODE: ${{ inputs.version_code || github.run_number }}
      BUILD_MODE: ${{ inputs.build_mode || 'simulator' }}
      CAPACITOR_BUILD: 'true'
      VITE_CAPACITOR_BUILD: 'true'
      VITE_BUILD_VERSION: ${{ github.sha }}
      VITE_ONESIGNAL_APP_ID: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'

      - name: Select Xcode 26 or later
        run: |
          XCODE_APP=$(python3 - <<'PY'
          import re
          from pathlib import Path
          candidates = []
          for path in Path('/Applications').glob('Xcode_*.app'):
              parts = tuple(map(int, re.findall(r'\d+', path.name)))
              if parts and parts[0] >= 26:
                  candidates.append((parts, str(path)))
          if not candidates:
              raise SystemExit('Xcode 26 or later is required')
          print(max(candidates)[1])
          PY
          )
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Check Apple signing configuration
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          python3 - <<'PY'
          import os
          required = ['IOS_DISTRIBUTION_P12_BASE64', 'IOS_P12_PASSWORD', 'IOS_PROVISIONING_PROFILE_BASE64']
          missing = [key for key in required if not os.environ.get(key)]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"Tenant `{os.environ['TENANT_SLUG']}`, mode `{os.environ['BUILD_MODE']}`.\n\n")
              if missing:
                  summary.write('Signed IPA requires these environment secrets: ' + ', '.join(f'`{key}`' for key in missing) + '.\n\n')
              else:
                  summary.write('Apple certificate and provisioning profile secrets are configured.\n\n')
          if missing and os.environ['BUILD_MODE'] == 'app-store':
              raise SystemExit('Missing Apple signing secrets: ' + ', '.join(missing))
          PY

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Package tenant storefront and branding
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node scripts/generate-tenant-offline-bootstrap.mjs
          python3 scripts/configure-tenant-ios.py

      - name: Package voice prompts
        run: |
          mkdir -p public/audio
          curl --retry 3 -fsSL 'https://iftinagents.com/__l5e/assets-v1/035ae08a-83c5-483c-a7a7-fc834544cf83/phone-number-prompt.wav' -o public/audio/phone.wav
          curl --retry 3 -fsSL 'https://iftinagents.com/__l5e/assets-v1/bd53b427-602d-4cdb-9102-ac6c3d065c12/otp-code-prompt.wav' -o public/audio/otp.wav
          curl --retry 3 -fsSL 'https://iftinagents.com/__l5e/assets-v1/d208b555-c658-4bb2-9ad9-fb3aeac0e72f/offline-mode-prompt.wav' -o public/audio/offline.wav

      - name: Build packaged web app
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          bun run build
          if [ ! -f dist/index.html ]; then
            SOURCE_DIR=''
            for candidate in .output/public dist/client dist/public build/client build; do
              if [ -f "$candidate/index.html" ]; then SOURCE_DIR="$candidate"; break; fi
            done
            test -n "$SOURCE_DIR"
            mkdir -p dist_ios
            cp -R "$SOURCE_DIR"/. dist_ios/
            rm -rf dist
            mv dist_ios dist
          fi
          node scripts/make-native-bootstrap.mjs

      - name: Generate and sync native iOS project
        run: |
          bunx cap add ios --packagemanager CocoaPods
          python3 scripts/configure-tenant-ios.py --native
          bunx capacitor-assets generate --ios --iconBackgroundColor "$SPLASH_COLOR" --splashBackgroundColor "$SPLASH_COLOR"
          bunx cap sync ios
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          assets = Path('ios/App/App/public')
          snapshot = json.loads((assets / 'tenant-bootstrap.json').read_text())
          assert snapshot['tenant']['slug'] == os.environ['TENANT_SLUG']
          assert 'iftin-native-bootstrap' in (assets / 'index.html').read_text()
          assert (Path('ios/App/App') / 'PrivacyInfo.xcprivacy').is_file()
          assert (assets / snapshot['tenant']['logo_url'].lstrip('/')).is_file()
          print('Verified packaged tenant identity, startup document, logo and privacy manifest')
          PY

      - name: Build iPhone simulator app
        if: env.BUILD_MODE == 'simulator'
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build | tee build/xcodebuild.log

      - name: Launch Marwaan on iPhone simulator
        if: env.BUILD_MODE == 'simulator'
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for group in data["devices"].values() for d in group if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl status_bar "$DEVICE_ID" override --time '9:41' --batteryState charged --batteryLevel 100
          xcrun simctl install "$DEVICE_ID" build/DerivedData/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$DEVICE_ID" "$APP_ID"
          sleep 20
          xcrun simctl spawn "$DEVICE_ID" launchctl list | grep -F "$APP_ID"
          xcrun simctl io "$DEVICE_ID" screenshot build/iphone-startup.png
          ditto -c -k --sequesterRsrc --keepParent build/DerivedData/Build/Products/Debug-iphonesimulator/App.app build/SimulatorApp.zip
          echo 'Simulator app compiled and launched on an iPhone simulator. Screenshot included in artifacts.' >> "$GITHUB_STEP_SUMMARY"

      - name: Install Apple distribution certificate and profile
        if: env.BUILD_MODE == 'app-store'
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          KEYCHAIN_PATH="$RUNNER_TEMP/tenant-signing.keychain-db"
          printf '%s' "$IOS_DISTRIBUTION_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/distribution.p12" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          security cms -D -i "$RUNNER_TEMP/app.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          python3 - <<'PY'
          import datetime, json, os, plistlib, shutil
          from pathlib import Path
          profile = plistlib.loads((Path(os.environ['RUNNER_TEMP']) / 'profile.plist').read_bytes())
          team = profile['TeamIdentifier'][0]
          app_id = os.environ['APP_ID']
          assert profile['Entitlements']['application-identifier'] == team + '.' + app_id, 'Provisioning profile belongs to another app'
          assert profile['ExpirationDate'] > datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None), 'Provisioning profile expired'
          assert not profile.get('ProvisionedDevices') and not profile.get('ProvisionsAllDevices'), 'An App Store distribution profile is required'
          assert not profile['Entitlements'].get('get-task-allow'), 'A distribution profile is required'
          for folder in ['Library/MobileDevice/Provisioning Profiles', 'Library/Developer/Xcode/UserData/Provisioning Profiles']:
              target = Path.home() / folder
              target.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(Path(os.environ['RUNNER_TEMP']) / 'app.mobileprovision', target / (profile['UUID'] + '.mobileprovision'))
          project = Path('ios/App/App.xcodeproj/project.pbxproj')
          settings = f'CODE_SIGN_STYLE = Manual;\n\t\t\t\tDEVELOPMENT_TEAM = {team};\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "{profile["UUID"]}";\n\t\t\t\t"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "Apple Distribution";'
          project.write_text(project.read_text().replace('CODE_SIGN_STYLE = Automatic;', settings))
          options = {'method': 'app-store-connect', 'teamID': team, 'signingStyle': 'manual', 'signingCertificate': 'Apple Distribution', 'provisioningProfiles': {app_id: profile['UUID']}, 'manageAppVersionAndBuildNumber': False}
          Path('build').mkdir(exist_ok=True)
          Path('build/ExportOptions.plist').write_bytes(plistlib.dumps(options))
          PY

      - name: Archive and export signed IPA
        if: env.BUILD_MODE == 'app-store'
        run: |
          set -o pipefail
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/App.xcarchive archive | tee build/xcodebuild.log
          xcodebuild -exportArchive -archivePath build/App.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/ipa
          echo 'Signed App Store IPA exported.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to App Store Connect
        if: env.BUILD_MODE == 'app-store' && inputs.upload_to_testflight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          API_PRIVATE_KEYS_DIR: ${{ runner.temp }}/private_keys
        run: |
          test -n "$APP_STORE_CONNECT_KEY_ID" && test -n "$APP_STORE_CONNECT_ISSUER_ID" && test -n "$APP_STORE_CONNECT_PRIVATE_KEY"
          mkdir -p "$API_PRIVATE_KEYS_DIR"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$API_PRIVATE_KEYS_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          IPA=$(find build/ipa -name '*.ipa' -print -quit)
          test -n "$IPA"
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$APP_STORE_CONNECT_KEY_ID" --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          echo 'IPA uploaded to App Store Connect for processing and TestFlight setup.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TENANT_SLUG }}-ios-${{ env.BUILD_MODE }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/SimulatorApp.zip
            build/iphone-startup.png
            build/ipa/*.ipa
            build/xcodebuild.log

      - name: Clean up signing material
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/tenant-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/tenant-signing.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/app.mobileprovision" "$RUNNER_TEMP/profile.plist"
          rm -rf "$RUNNER_TEMP/private_keys"
