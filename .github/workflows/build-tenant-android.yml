name: Build tenant Android app

on:
  workflow_dispatch:
    inputs:
      tenant_slug:
        description: "Tenant slug (reseller code), e.g. marwaan"
        required: true
      app_name:
        description: "App name shown on the phone"
        required: true
      app_id:
        description: "Android applicationId (reverse domain)"
        required: false
        default: ""
      logo_url:
        description: "Public URL of the tenant logo (PNG, >=1024px, square)"
        required: false
        default: ""
      splash_color:
        description: "Splash / status bar color (hex)"
        required: false
        default: "#0F4C81"
      version_name:
        description: "Version name, e.g. 1.0.0"
        required: false
        default: "1.0.0"
      version_code:
        description: "Version code (integer, must increase per release)"
        required: false
        default: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TENANT_SLUG: ${{ inputs.tenant_slug }}
      APP_NAME: ${{ inputs.app_name }}
      APP_VERSION_NAME: ${{ inputs.version_name }}
      APP_VERSION_CODE: ${{ inputs.version_code }}
      ONESIGNAL_DISABLE_LOCATION: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/android-sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1 || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "Installing Android command line tools..."
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -sSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-extract
            rm -rf "$SDK_ROOT/cmdline-tools/latest"
            mv /tmp/cmdline-tools-extract/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "build-tools;36.0.0" "platforms;android-36"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Patch Android 15+ IME inset handling
        run: |
          set -e
          FILE="node_modules/@capawesome/capacitor-android-edge-to-edge-support/android/src/main/java/io/capawesome/capacitorjs/plugins/androidedgetoedgesupport/EdgeToEdge.java"
          test -f "$FILE"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("node_modules/@capawesome/capacitor-android-edge-to-edge-support/android/src/main/java/io/capawesome/capacitorjs/plugins/androidedgetoedgesupport/EdgeToEdge.java")
          s = p.read_text()
          old = """        boolean keyboardVisible = currentInsets.isVisible(WindowInsetsCompat.Type.ime());
        // When keyboard is visible, don't apply bottom margin to avoid double-counting
        // (the system already resizes the window for the keyboard)
        int bottomMargin = keyboardVisible ? 0 : Math.max(imeInsets.bottom, systemBarsInsets.bottom);
"""
          new = """        // Android 15+ edge-to-edge no longer shrinks the app window when the IME
        // opens. The IME height is delivered only as an inset, so always include
        // it in the WebView bottom margin. Otherwise the keyboard covers phone
        // and OTP fields.
        int bottomMargin = Math.max(imeInsets.bottom, systemBarsInsets.bottom);
"""
          if old not in s:
              raise SystemExit("Expected EdgeToEdge IME block not found; package source changed")
          p.write_text(s.replace(old, new))
          PY
          grep -Fq 'int bottomMargin = Math.max(imeInsets.bottom, systemBarsInsets.bottom);' "$FILE"

      - name: Verify OneSignal Capacitor dependency
        run: |
          node -e 'const p=require("./package.json"); if(!p.dependencies?.["@onesignal/capacitor-plugin"]) process.exit(1)'

      - name: Verify AdMob is completely absent
        run: |
          set -e
          if grep -Fq '@capacitor-community/admob' package.json bun.lock; then
            echo "::error::AdMob dependency must not be present"
            exit 1
          fi
          if grep -Rqi 'capacitor-community-admob\|com.google.android.gms.ads.APPLICATION_ID' android; then
            echo "::error::AdMob Android integration must not be present"
            exit 1
          fi

      - name: Configure app identity for this tenant
        run: |
          APP_ID="${{ inputs.app_id }}"
          if [ -z "$APP_ID" ]; then APP_ID="com.iftin.$(echo "$TENANT_SLUG" | tr -cd '[:alnum:]')"; fi
          export APP_ID
          echo "APP_ID=$APP_ID" >> "$GITHUB_ENV"
          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8"));
            cfg.appId = process.env.APP_ID;
            cfg.appName = process.env.APP_NAME;
            const color = process.env.SPLASH_COLOR;
            cfg.plugins.SplashScreen.backgroundColor = color;
            cfg.plugins.StatusBar.backgroundColor = color;
            cfg.plugins.StatusBar.style = "LIGHT";
            cfg.plugins.NavigationBar.backgroundColor = color;
            cfg.plugins.NavigationBar.style = "LIGHT";

            // EdgeToEdge owns the visible Android status/navigation bar surfaces.
            // Keep it in sync with the tenant colour too; otherwise its default
            // #0F4C81 leaks through during splash/startup.
            cfg.plugins.EdgeToEdge.backgroundColor = color;
            cfg.plugins.EdgeToEdge.statusBarColor = color;
            cfg.plugins.EdgeToEdge.navigationBarColor = color;
            cfg.plugins.SystemBars.style = "LIGHT";

            // Tenant APKs boot from the packaged Capacitor web bundle for
            // offline safety, then the app may navigate the WebView to the live
            // tenant route when connectivity is available. allowNavigation keeps
            // that live route inside the Capacitor shell while preserving native
            // plugins; no server.url is used, so cold/offline startup stays local.
            cfg.server = {
              ...(cfg.server || {}),
              allowNavigation: ["iftinagents.com", "*.iftinagents.com"]
            };
            delete cfg.server.url;

            fs.writeFileSync("capacitor.config.json", JSON.stringify(cfg, null, 2));
          '
        env:
          APP_ID: ${{ inputs.app_id }}
          SPLASH_COLOR: ${{ inputs.splash_color }}

      - name: Generate packaged offline tenant snapshot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -e
          if [ -z "$SUPABASE_URL" ] || [ -z "$SERVICE_KEY" ]; then
            echo "::error::Supabase secrets are required to build a full offline tenant APK"
            exit 1
          fi
          node scripts/generate-tenant-offline-bootstrap.mjs
          grep -Fq "tenantOfflineBootstrap" src/generated/tenantOfflineBootstrap.ts
          grep -Fq "\"slug\":\"${TENANT_SLUG}\"" src/generated/tenantOfflineBootstrap.ts
          test -s public/tenant-bootstrap.js
          test -s public/tenant-bootstrap.json
          echo "Tenant storefront snapshot packaged for first-launch offline mode"

      - name: Package tenant voice prompts
        run: |
          set -e
          mkdir -p public/audio
          curl --retry 3 --retry-delay 1 -fsSL "https://iftinagents.com/__l5e/assets-v1/035ae08a-83c5-483c-a7a7-fc834544cf83/phone-number-prompt.wav" -o public/audio/phone.wav
          curl --retry 3 --retry-delay 1 -fsSL "https://iftinagents.com/__l5e/assets-v1/bd53b427-602d-4cdb-9102-ac6c3d065c12/otp-code-prompt.wav" -o public/audio/otp.wav
          curl --retry 3 --retry-delay 1 -fsSL "https://iftinagents.com/__l5e/assets-v1/d208b555-c658-4bb2-9ad9-fb3aeac0e72f/offline-mode-prompt.wav" -o public/audio/offline.wav
          test -s public/audio/phone.wav
          test -s public/audio/otp.wav
          test -s public/audio/offline.wav

      - name: Stamp Android web bundle
        run: |
          printf '{"commit":"%s","tenant":"%s","bannerCache":"tenant-scoped","numericKeyboard":"native-webview-numeric","nativePush":"onesignal","offlineBootstrap":"packaged-v1"}\n' "${GITHUB_SHA}" "${TENANT_SLUG}" > public/apk-build.json

      - name: Build web bundle
        run: bun run build
        env:
          CAPACITOR_BUILD: "true"
          VITE_TENANT_SLUG: ${{ inputs.tenant_slug }}
          VITE_TENANT_NAME: ${{ inputs.app_name }}
          VITE_TENANT_LOGO_URL: ${{ inputs.logo_url }}
          VITE_SPLASH_COLOR: ${{ inputs.splash_color }}
          VITE_BUILD_VERSION: ${{ github.sha }}
          VITE_ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Prepare web assets for Capacitor
        run: |
          set -e
          if [ -f dist/index.html ]; then
            echo "dist/ already valid"
          else
            SRC=""
            for d in .output/public dist/client dist/public build/client build; do
              if [ -f "$d/index.html" ]; then SRC="$d"; break; fi
            done
            if [ -z "$SRC" ]; then
              echo "No built index.html found. Build output files:"
              for d in .output dist build; do
                if [ -d "$d" ]; then
                  find "$d" -maxdepth 4 -type f -print
                fi
              done
              exit 1
            fi
            echo "Using web assets from $SRC"
            rm -rf dist_capacitor
            mkdir -p dist_capacitor
            cp -R "$SRC"/. dist_capacitor/
            rm -rf dist
            mv dist_capacitor dist
          fi

      - name: Sync Capacitor
        run: |
          rm -rf android/app/src/main/assets/public
          npx cap sync android

      - name: Verify fresh web bundle was packaged
        env:
          SPLASH_COLOR: ${{ inputs.splash_color }}
        run: |
          ASSETS=android/app/src/main/assets
          FAILED=0
          fail() { echo "::error::VERIFY FAILED: $1"; FAILED=1; }

          test -f "$ASSETS/public/index.html" || fail "index.html missing from Android assets"
          test -f "$ASSETS/public/apk-build.json" || fail "apk-build.json missing from Android assets"
          test -f "$ASSETS/public/tenant-bootstrap.js" || fail "tenant-bootstrap.js missing from Android assets"
          test -f "$ASSETS/public/tenant-bootstrap.json" || fail "tenant-bootstrap.json missing from Android assets"
          test -s "$ASSETS/public/audio/phone.wav" || fail "phone voice prompt missing from Android assets"
          test -s "$ASSETS/public/audio/otp.wav" || fail "OTP voice prompt missing from Android assets"
          test -s "$ASSETS/public/audio/offline.wav" || fail "offline voice prompt missing from Android assets"

          if [ -f "$ASSETS/public/apk-build.json" ]; then
            echo "apk-build.json: $(cat "$ASSETS/public/apk-build.json")"
            grep -Fq "${GITHUB_SHA}" "$ASSETS/public/apk-build.json" || fail "apk-build.json is from an older commit"
            grep -Fq '"bannerCache":"tenant-scoped"' "$ASSETS/public/apk-build.json" || fail "bannerCache stamp missing"
            grep -Fq '"numericKeyboard":"native-webview-numeric"' "$ASSETS/public/apk-build.json" || fail "numericKeyboard stamp missing"
            grep -Fq '"nativePush":"onesignal"' "$ASSETS/public/apk-build.json" || fail "native push stamp missing"
            grep -Fq '"offlineBootstrap":"packaged-v1"' "$ASSETS/public/apk-build.json" || fail "offline bootstrap stamp missing"
          fi

          grep -Fq "tenant-bootstrap.js" "$ASSETS/public/index.html" || fail "offline bootstrap is not loaded before app startup"
          grep -Fq "offline_bootstrap_version" "$ASSETS/public/tenant-bootstrap.js" || fail "offline bootstrap cache seed missing"
          grep -Fq "\"slug\":\"${TENANT_SLUG}\"" "$ASSETS/public/tenant-bootstrap.json" || fail "offline snapshot belongs to the wrong tenant"

          grep -Eq '"captureInput"[[:space:]]*:[[:space:]]*false' capacitor.config.json \
            || fail "captureInput is not false in capacitor.config.json"
          grep -Eq '"resize"[[:space:]]*:[[:space:]]*"native"' capacitor.config.json \
            || fail "Android keyboard must resize the native WebView"
          grep -Fq 'SOFT_INPUT_ADJUST_RESIZE' android/app/src/main/java/com/iftin/agents/MainActivity.java \
            || fail "Android activity does not enforce keyboard resize"
          grep -Eq '"launchShowDuration"[[:space:]]*:[[:space:]]*0' capacitor.config.json \
            || fail "tenant splash duration is not 0ms"
          grep -Eq '"launchFadeOutDuration"[[:space:]]*:[[:space:]]*0' capacitor.config.json \
            || fail "tenant splash fade-out duration is not 0ms"
          grep -Eq '"launchAutoHide"[[:space:]]*:[[:space:]]*true' capacitor.config.json \
            || fail "tenant splash auto-hide is not enabled"
          grep -Fq "\"statusBarColor\": \"${SPLASH_COLOR}\"" capacitor.config.json \
            || fail "EdgeToEdge status bar color is not tenant splash color"
          if grep -Eq '"url"[[:space:]]*:' capacitor.config.json; then
            fail "tenant APK must not use remote server.url; packaged webDir is the offline fallback"
          fi
          grep -Fq '"iftinagents.com"' capacitor.config.json \
            || fail "live tenant host is not allowed for hybrid APK updates"
          if [ -f "$ASSETS/capacitor.config.json" ]; then
            grep -Eq '"captureInput"[[:space:]]*:[[:space:]]*false' "$ASSETS/capacitor.config.json" \
              || fail "captureInput is not false in the synced Android capacitor.config.json"
          fi

          grep -Rqs "offline_banners" "$ASSETS/public" || fail "tenant banner cache code missing from bundle"
          grep -Rqs "SET_VERSION" "$ASSETS/public" || fail "service worker version handshake missing from bundle"
          grep -Rqi "onesignal" android 2>/dev/null || fail "OneSignal Capacitor native plugin was not synced"

          if [ "$FAILED" != "0" ]; then
            echo "Android assets tree:"
            find "$ASSETS" -maxdepth 2 -print
            exit 1
          fi
          echo "Fresh tenant offline snapshot, native push and native numeric keyboard configuration verified in Android bundle"

      - name: Apply app id, label and splash color
        env:
          SPLASH_COLOR: ${{ inputs.splash_color }}
        run: |
          sed -i "s/applicationId \".*\"/applicationId \"${APP_ID}\"/" android/app/build.gradle
          python3 - <<'PY'
          import os, re
          p = "android/app/src/main/res/values/strings.xml"
          s = open(p).read()
          name = os.environ["APP_NAME"]
          s = re.sub(r'(<string name="app_name">).*?(</string>)', r'\g<1>' + name + r'\g<2>', s)
          s = re.sub(r'(<string name="title_activity_main">).*?(</string>)', r'\g<1>' + name + r'\g<2>', s)
          open(p, "w").write(s)

          color = (os.environ.get("SPLASH_COLOR") or "#0F4C81").strip()
          if not re.fullmatch(r"#[0-9A-Fa-f]{6}", color):
              color = "#0F4C81"
          c = "android/app/src/main/res/values/colors.xml"
          s = open(c).read()
          s = re.sub(r'(<color name="[A-Za-z_]+">)#[0-9A-Fa-f]{6}(</color>)', r'\g<1>' + color + r'\g<2>', s)
          open(c, "w").write(s)
          PY

      - name: Generate icons and splash from tenant logo
        env:
          LOGO_URL: ${{ inputs.logo_url }}
          SPLASH_COLOR: ${{ inputs.splash_color }}
        run: |
          if [ -z "${LOGO_URL//[[:space:]]/}" ]; then
            echo "No tenant logo URL supplied; keeping the default Android artwork."
            exit 0
          fi
          case "$LOGO_URL" in
            https://*|http://*) ;;
            *)
              echo "Logo URL must begin with https:// or http://; keeping the default Android artwork."
              exit 0
              ;;
          esac
          mkdir -p assets
          if ! curl --retry 3 --retry-delay 2 -fsSL "$LOGO_URL" -o assets/logo.png; then
            echo "Tenant logo could not be downloaded; keeping the default Android artwork."
            exit 0
          fi
          cp assets/logo.png assets/icon.png
          cp assets/logo.png assets/splash.png
          npx @capacitor/assets generate --android \
            --iconBackgroundColor "$SPLASH_COLOR" \
            --splashBackgroundColor "$SPLASH_COLOR" || echo "Asset generation failed; keeping the existing Android artwork."

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/iftin.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/iftin.keystore" >> "$GITHUB_ENV"

      - name: Build signed APK and AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.tenant_slug }}-android
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab

      - name: Publish APK to Supabase Storage and update tenant
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SERVICE_KEY" ] || [ -z "$SUPABASE_URL" ]; then
            echo "Supabase secrets missing - skipping publish"
            exit 0
          fi
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          OBJECT="apks/${TENANT_SLUG}-${APP_VERSION_NAME}.apk"
          curl -fsS -X POST "$SUPABASE_URL/storage/v1/object/$OBJECT" \
            -H "Authorization: Bearer $SERVICE_KEY" \
            -H "x-upsert: true" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary "@$APK"
          STORED_PATH="${TENANT_SLUG}-${APP_VERSION_NAME}.apk"
          curl -fsS -X PATCH "$SUPABASE_URL/rest/v1/tenants?slug=eq.$TENANT_SLUG" \
            -H "apikey: $SERVICE_KEY" \
            -H "Authorization: Bearer $SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"apk_url\":\"$STORED_PATH\",\"apk_version\":\"$APP_VERSION_NAME\"}"
          echo "APK published: $STORED_PATH"
