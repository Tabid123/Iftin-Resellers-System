name: Build tenant Android app

on:
  workflow_dispatch:
    inputs:
      tenant_slug:
        description: "Tenant slug (reseller code), e.g. marwaan"
        required: true
      app_name:
        description: "Fallback app name only; tenant database name is authoritative"
        required: false
        default: ""
      app_id:
        description: "Android applicationId (reverse domain)"
        required: false
        default: ""
      logo_url:
        description: "Fallback logo only; tenant database logo is authoritative"
        required: false
        default: ""
      splash_color:
        description: "Fallback color only; tenant primary color is authoritative"
        required: false
        default: ""
      version_name:
        description: "Version name, e.g. 1.0.0"
        required: false
        default: "1.0.0"
      version_code:
        description: "Version code (integer, must increase per release)"
        required: false
        default: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TENANT_SLUG: ${{ inputs.tenant_slug }}
      INPUT_APP_NAME: ${{ inputs.app_name }}
      INPUT_APP_ID: ${{ inputs.app_id }}
      INPUT_LOGO_URL: ${{ inputs.logo_url }}
      INPUT_SPLASH_COLOR: ${{ inputs.splash_color }}
      APP_VERSION_NAME: ${{ inputs.version_name }}
      APP_VERSION_CODE: ${{ inputs.version_code }}
      ONESIGNAL_DISABLE_LOCATION: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/android-sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1 || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "Installing Android command line tools..."
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -sSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-extract
            rm -rf "$SDK_ROOT/cmdline-tools/latest"
            mv /tmp/cmdline-tools-extract/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "build-tools;36.0.0" "platforms;android-36"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify OneSignal Capacitor dependency
        run: |
          node -e 'const p=require("./package.json"); if(!p.dependencies?.["@onesignal/capacitor-plugin"]) process.exit(1)'

      - name: Generate packaged offline tenant snapshot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -e
          if [ -z "$SUPABASE_URL" ] || [ -z "$SERVICE_KEY" ]; then
            echo "::error::Supabase secrets are required to build a full offline tenant APK"
            exit 1
          fi
          node scripts/generate-tenant-offline-bootstrap.mjs
          grep -Fq "tenantOfflineBootstrap" src/generated/tenantOfflineBootstrap.ts
          grep -Fq "\"slug\":\"${TENANT_SLUG}\"" src/generated/tenantOfflineBootstrap.ts
          test -s public/tenant-bootstrap.js
          test -s public/tenant-bootstrap.json
          echo "Tenant storefront snapshot packaged for first-launch offline mode"

      - name: Resolve authoritative tenant build identity
        run: |
          set -e
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const snapshot = JSON.parse(fs.readFileSync('public/tenant-bootstrap.json', 'utf8'));
          const tenant = snapshot.tenant || {};
          const slug = String(tenant.slug || process.env.TENANT_SLUG || '').trim().toLowerCase();
          const name = String(tenant.name || process.env.INPUT_APP_NAME || slug || 'App').trim();
          const logo = String(snapshot.tenantLogoUrl || tenant.logo_url || process.env.INPUT_LOGO_URL || '').trim();
          const firstBanner = String(snapshot.firstBannerUrl || '').trim();

          let color = String(tenant.primary_color || process.env.INPUT_SPLASH_COLOR || '#0F4C81').trim();
          if (!/^#[0-9A-Fa-f]{6}$/.test(color)) color = '#0F4C81';

          let appId = String(process.env.INPUT_APP_ID || '').trim();
          if (!appId) appId = 'com.iftin.' + slug.replace(/[^a-z0-9]/g, '');

          fs.mkdirSync('.tenant-build', { recursive: true });

          function materializeDataImage(value, basename) {
            const match = String(value || '').match(/^data:image\/([a-zA-Z0-9.+-]+);base64,(.+)$/s);
            if (!match) return '';
            const extMap = { jpeg: 'jpg', 'svg+xml': 'svg' };
            const ext = extMap[match[1].toLowerCase()] || match[1].toLowerCase();
            const file = path.join('.tenant-build', `${basename}.${ext}`);
            fs.writeFileSync(file, Buffer.from(match[2], 'base64'));
            return file;
          }

          const logoFile = materializeDataImage(logo, 'tenant-logo');
          const bannerFile = materializeDataImage(firstBanner, 'tenant-banner');

          // IMPORTANT: never put data: URIs in GITHUB_ENV. A large base64 logo
          // makes every following process inherit a huge environment and Linux
          // refuses to start bash/node with "Argument list too long".
          const logoUrl = /^https?:\/\//i.test(logo) ? logo : '';
          const bannerUrl = /^https?:\/\//i.test(firstBanner) ? firstBanner : '';

          const envLines = [
            ['APP_NAME', name],
            ['APP_ID', appId],
            ['TENANT_LOGO_URL', logoUrl],
            ['TENANT_LOGO_FILE', logoFile],
            ['TENANT_FIRST_BANNER_URL', bannerUrl],
            ['TENANT_FIRST_BANNER_FILE', bannerFile],
            ['SPLASH_COLOR', color],
            ['VITE_TENANT_NAME', name],
            ['VITE_TENANT_LOGO_URL', logoUrl],
            ['VITE_SPLASH_COLOR', color],
          ];
          fs.appendFileSync(
            process.env.GITHUB_ENV,
            envLines.map(([k,v]) => `${k}=${String(v).replace(/\r?\n/g, '')}`).join('\n') + '\n',
          );

          console.log(`Resolved tenant identity: ${slug} -> ${name}`);
          console.log(`Resolved tenant logo: ${logoFile ? 'embedded data image -> ' + logoFile : (logoUrl || '(none)')}`);
          console.log(`Resolved first banner: ${bannerFile ? 'embedded data image -> ' + bannerFile : (bannerUrl || '(none)')}`);
          console.log(`Resolved tenant color: ${color}`);
          NODE

      - name: Configure app identity for this tenant
        run: |
          set -e
          node <<'NODE'
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
          const slug = String(process.env.TENANT_SLUG || '').trim().toLowerCase();
          const name = String(process.env.APP_NAME || '').trim();
          const logo = String(process.env.TENANT_LOGO_URL || '').trim();
          const color = String(process.env.SPLASH_COLOR || '#0F4C81').trim();
          const firstBanner = String(process.env.TENANT_FIRST_BANNER_URL || '').trim();

          cfg.appId = process.env.APP_ID;
          cfg.appName = name;
          cfg.plugins.SplashScreen.backgroundColor = color;
          cfg.plugins.StatusBar.backgroundColor = color;
          cfg.plugins.NavigationBar.backgroundColor = color;

          const params = new URLSearchParams({
            apk: '1',
            apkName: name,
            apkColor: color,
          });
          // Only short HTTP(S) values belong in the live URL. Embedded base64
          // artwork is already available in the tenant snapshot/native file.
          if (logo) params.set('apkLogo', logo);
          if (firstBanner) params.set('apkBanner', firstBanner);

          cfg.server = {
            url: `https://iftinagents.com/t/${slug}?${params.toString()}`,
            cleartext: false,
            allowNavigation: ['iftinagents.com'],
          };

          fs.writeFileSync('capacitor.config.json', JSON.stringify(cfg, null, 2));
          NODE

      - name: Stamp Android web bundle
        run: |
          printf '{"commit":"%s","tenant":"%s","bannerCache":"tenant-scoped","numericKeyboard":"native-webview-numeric","nativePush":"onesignal","offlineBootstrap":"packaged-v1"}\n' "${GITHUB_SHA}" "${TENANT_SLUG}" > public/apk-build.json

      - name: Build web bundle
        run: bun run build
        env:
          CAPACITOR_BUILD: "true"
          VITE_TENANT_SLUG: ${{ inputs.tenant_slug }}
          VITE_BUILD_VERSION: ${{ github.sha }}
          VITE_ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Prepare web assets for Capacitor
        run: |
          set -e
          if [ -f dist/index.html ]; then
            echo "dist/ already valid"
          else
            SRC=""
            for d in .output/public dist/client dist/public build/client build; do
              if [ -f "$d/index.html" ]; then SRC="$d"; break; fi
            done
            if [ -z "$SRC" ]; then
              echo "No built index.html found. Build output files:"
              for d in .output dist build; do
                if [ -d "$d" ]; then
                  find "$d" -maxdepth 4 -type f -print
                fi
              done
              exit 1
            fi
            echo "Using web assets from $SRC"
            rm -rf dist_capacitor
            mkdir -p dist_capacitor
            cp -R "$SRC"/. dist_capacitor/
            rm -rf dist
            mv dist_capacitor dist
          fi

      - name: Sync Capacitor
        run: |
          rm -rf android/app/src/main/assets/public
          npx cap sync android

      - name: Verify fresh web bundle was packaged
        run: |
          ASSETS=android/app/src/main/assets
          FAILED=0
          fail() { echo "::error::VERIFY FAILED: $1"; FAILED=1; }

          test -f "$ASSETS/public/index.html" || fail "index.html missing from Android assets"
          test -f "$ASSETS/public/apk-build.json" || fail "apk-build.json missing from Android assets"
          test -f "$ASSETS/public/tenant-bootstrap.js" || fail "tenant-bootstrap.js missing from Android assets"
          test -f "$ASSETS/public/tenant-bootstrap.json" || fail "tenant-bootstrap.json missing from Android assets"

          if [ -f "$ASSETS/public/apk-build.json" ]; then
            echo "apk-build.json: $(cat "$ASSETS/public/apk-build.json")"
            grep -Fq "${GITHUB_SHA}" "$ASSETS/public/apk-build.json" || fail "apk-build.json is from an older commit"
            grep -Fq '"bannerCache":"tenant-scoped"' "$ASSETS/public/apk-build.json" || fail "bannerCache stamp missing"
            grep -Fq '"numericKeyboard":"native-webview-numeric"' "$ASSETS/public/apk-build.json" || fail "numericKeyboard stamp missing"
            grep -Fq '"nativePush":"onesignal"' "$ASSETS/public/apk-build.json" || fail "native push stamp missing"
            grep -Fq '"offlineBootstrap":"packaged-v1"' "$ASSETS/public/apk-build.json" || fail "offline bootstrap stamp missing"
          fi

          grep -Fq "tenant-bootstrap.js" "$ASSETS/public/index.html" || fail "offline bootstrap is not loaded before app startup"
          grep -Fq "offline_bootstrap_version" "$ASSETS/public/tenant-bootstrap.js" || fail "offline bootstrap cache seed missing"
          grep -Fq "\"slug\":\"${TENANT_SLUG}\"" "$ASSETS/public/tenant-bootstrap.json" || fail "offline snapshot belongs to the wrong tenant"

          grep -Eq '"captureInput"[[:space:]]*:[[:space:]]*false' capacitor.config.json \
            || fail "captureInput is not false in capacitor.config.json"
          grep -Fq "\"url\": \"https://iftinagents.com/t/${TENANT_SLUG}?" capacitor.config.json \
            || fail "tenant live storefront URL is missing from capacitor.config.json"
          grep -Fq "\"appName\": \"${APP_NAME}\"" capacitor.config.json \
            || fail "native app name does not match authoritative tenant name"
          if [ -f "$ASSETS/capacitor.config.json" ]; then
            grep -Eq '"captureInput"[[:space:]]*:[[:space:]]*false' "$ASSETS/capacitor.config.json" \
              || fail "captureInput is not false in the synced Android capacitor.config.json"
          fi

          grep -Rqs "offline_banners" "$ASSETS/public" || fail "tenant banner cache code missing from bundle"
          grep -Rqs "SET_VERSION" "$ASSETS/public" || fail "service worker version handshake missing from bundle"
          grep -Rqi "onesignal" android 2>/dev/null || fail "OneSignal Capacitor native plugin was not synced"

          if [ "$FAILED" != "0" ]; then
            echo "Android assets tree:"
            find "$ASSETS" -maxdepth 2 -print
            exit 1
          fi
          echo "Fresh tenant offline snapshot, native push and native numeric keyboard configuration verified in Android bundle"

      - name: Apply app id, label and splash color
        run: |
          sed -i "s/applicationId \".*\"/applicationId \"${APP_ID}\"/" android/app/build.gradle
          python3 - <<'PY'
          import os, re
          p = "android/app/src/main/res/values/strings.xml"
          s = open(p).read()
          name = os.environ["APP_NAME"]
          s = re.sub(r'(<string name="app_name">).*?(</string>)', r'\g<1>' + name + r'\g<2>', s)
          s = re.sub(r'(<string name="title_activity_main">).*?(</string>)', r'\g<1>' + name + r'\g<2>', s)
          open(p, "w").write(s)

          color = (os.environ.get("SPLASH_COLOR") or "#0F4C81").strip()
          if not re.fullmatch(r"#[0-9A-Fa-f]{6}", color):
              color = "#0F4C81"
          c = "android/app/src/main/res/values/colors.xml"
          s = open(c).read()
          s = re.sub(r'(<color name="[A-Za-z_]+">)#[0-9A-Fa-f]{6}(</color>)', r'\g<1>' + color + r'\g<2>', s)
          open(c, "w").write(s)
          PY

      - name: Generate icons and splash from tenant logo
        run: |
          set -e
          LOGO_URL="${TENANT_LOGO_URL:-}"
          LOGO_FILE="${TENANT_LOGO_FILE:-}"
          mkdir -p assets

          if [ -n "$LOGO_FILE" ] && [ -s "$LOGO_FILE" ]; then
            echo "Using embedded tenant logo file: $LOGO_FILE"
            cp "$LOGO_FILE" assets/logo-source
          elif [ -n "${LOGO_URL//[[:space:]]/}" ]; then
            case "$LOGO_URL" in
              https://*|http://*) ;;
              *)
                echo "Unsupported tenant logo value; keeping default Android artwork."
                exit 0
                ;;
            esac
            if ! curl --retry 3 --retry-delay 2 -fsSL "$LOGO_URL" -o assets/logo-source; then
              echo "Tenant logo could not be downloaded; keeping default Android artwork."
              exit 0
            fi
          else
            echo "No tenant logo supplied; keeping default Android artwork."
            exit 0
          fi

          cp assets/logo-source assets/icon.png
          cp assets/logo-source assets/splash.png
          npx @capacitor/assets generate --android \
            --iconBackgroundColor "$SPLASH_COLOR" \
            --splashBackgroundColor "$SPLASH_COLOR" || echo "Asset generation failed; keeping the existing Android artwork."

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/iftin.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/iftin.keystore" >> "$GITHUB_ENV"

      - name: Build signed APK and AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.tenant_slug }}-android
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab

      - name: Publish APK to Supabase Storage and update tenant
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SERVICE_KEY" ] || [ -z "$SUPABASE_URL" ]; then
            echo "Supabase secrets missing - skipping publish"
            exit 0
          fi
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          OBJECT="apks/${TENANT_SLUG}-${APP_VERSION_NAME}.apk"
          curl -fsS -X POST "$SUPABASE_URL/storage/v1/object/$OBJECT" \
            -H "Authorization: Bearer $SERVICE_KEY" \
            -H "x-upsert: true" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary "@$APK"
          STORED_PATH="${TENANT_SLUG}-${APP_VERSION_NAME}.apk"
          curl -fsS -X PATCH "$SUPABASE_URL/rest/v1/tenants?slug=eq.$TENANT_SLUG" \
            -H "apikey: $SERVICE_KEY" \
            -H "Authorization: Bearer $SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"apk_url\":\"$STORED_PATH\",\"apk_version\":\"$APP_VERSION_NAME\"}"
          echo "APK published: $STORED_PATH"
