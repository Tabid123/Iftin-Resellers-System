name: Verify Android native bridge

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "capacitor.config.json"
      - "package.json"
      - "bun.lock"
      - "src/services/onesignal.ts"
      - ".github/workflows/build-tenant-android.yml"
      - ".github/workflows/verify-android-native.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - "capacitor.config.json"
      - "package.json"
      - "bun.lock"
      - "src/services/onesignal.ts"
      - ".github/workflows/build-tenant-android.yml"
      - ".github/workflows/verify-android-native.yml"
  workflow_dispatch:

jobs:
  android-debug:
    runs-on: ubuntu-latest
    env:
      ONESIGNAL_DISABLE_LOCATION: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/android-sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1 || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -sSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-extract
            rm -rf "$SDK_ROOT/cmdline-tools/latest"
            mv /tmp/cmdline-tools-extract/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "build-tools;36.0.0" "platforms;android-36"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify committed OneSignal dependency
        run: |
          node -e 'const p=require("./package.json"); if(p.dependencies?.["@onesignal/capacitor-plugin"]!=="1.0.6") process.exit(1)'

      - name: Verify single Android inset owner
        run: |
          node -e '
            const c=require("./capacitor.config.json");
            if (c.plugins?.SystemBars?.insetsHandling !== "disable") {
              console.error("SystemBars.insetHandling must stay disabled while native MainActivity owns stable WebView insets");
              process.exit(1);
            }
            if (c.plugins?.Keyboard?.resizeOnFullScreen !== false) {
              console.error("Keyboard.resizeOnFullScreen must remain false for stable edge-to-edge geometry");
              process.exit(1);
            }
          '
          grep -Fq "getInsetsIgnoringVisibility" android/app/src/main/java/com/iftin/agents/MainActivity.java \
            || { echo "::error::stable native system-bar inset handling missing"; exit 1; }
          grep -Fq "WindowInsetsCompat.CONSUMED" android/app/src/main/java/com/iftin/agents/MainActivity.java \
            || { echo "::error::native inset event is not consumed"; exit 1; }

      - name: Prepare minimal Capacitor web directory
        run: |
          mkdir -p dist
          printf '<!doctype html><html><body>native verification</body></html>\n' > dist/index.html

      - name: Sync Capacitor plugins
        run: npx cap sync android

      - name: Verify notification permission and OneSignal bridge
        run: |
          grep -Rqs "android.permission.POST_NOTIFICATIONS" android/app/src/main android/app/build.gradle android \
            || { echo "::error::POST_NOTIFICATIONS permission missing"; exit 1; }
          grep -Rqi "onesignal" android 2>/dev/null \
            || { echo "::error::OneSignal Capacitor plugin was not synced"; exit 1; }
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            test -f "android/app/src/main/res/drawable-${density}/ic_stat_onesignal_default.xml" \
              || { echo "::error::missing OneSignal icon for ${density}"; exit 1; }
          done

      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
